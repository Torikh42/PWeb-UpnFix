# =============================================================
# apisix_config/config.yaml
# Konfigurasi utama Apache APISIX 3.10.0
# =============================================================
# Arsitektur: APISIX terhubung ke etcd sebagai config provider.
# SkyWalking plugin dikonfigurasi via plugin_attr untuk HTTP tracing.
# SSL diatur untuk port 9443 (di-mount via volume Docker).
# =============================================================

apisix:
  # Port listener HTTP dan HTTPS
  node_listen:
    - 9080   # HTTP

  enable_ipv6: false
  enable_reuseport: true
  enable_http2: true

  # Format log upstream (menampilkan IP client asli)
  show_upstream_logs_format: "real_client_ip: $real_client_ip"

  # Binding address untuk HTTP dan HTTPS listener
  http_listen: 0.0.0.0
  https_listen: 0.0.0.0

  # Konfigurasi SSL / TLS (Layer 6 - Presentation)
  ssl:
    listen:
      - port: 9443

    # Sertifikat di-mount dari ./apisix_config/certs/ via Docker volume
    cert: "/usr/local/apisix/conf/certs/cert.pem"
    key:  "/usr/local/apisix/conf/certs/key.pem"

  # mTLS Admin API (kosong = disabled untuk simulasi lokal)
  admin_api_mtls:
    admin_ssl_cert: ""
    admin_ssl_key: ""
    admin_ssl_ca_cert: ""

